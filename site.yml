---

- name: Initialise
  hosts: webservers
  become: true
  remote_user: ansible
  gather_facts: yes
  roles:
    - role: init
  tags: [init]


- name: Deploy docker compose cluster
  hosts: webservers
  become: true
  remote_user: ansible
  gather_facts: yes
  roles:
    - role: docker
  tags: [docker]


- name: Deploy the alerthandler
  hosts: webservers
  become: true
  remote_user: ansible
  gather_facts: yes
  roles:
    - role: alerthandler
  tags: [alerthandler]


