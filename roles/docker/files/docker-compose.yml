services:
  db:
    container_name: db
    image: postgres:15-alpine
    restart: always
    ports:
      - 5432:5432
    env_file:
      - .env
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    volumes:
      - db-data:/var/lib/postgresql/data

  cache:
    container_name: cache
    image: redis:alpine
    ports:
      - 6379:6379
    env_file:
      - .env
    environment:
      - REDIS_PASSWORD
    command: >
      sh -c "redis-server --requirepass \"$REDIS_PASSWORD\""


  apache:
   container_name: apache
   image: httpd:2.4-alpine
   restart: unless-stopped
   ports:
    - 80:80
    - 443:443
   volumes:
    - /opt/apache/conf/:/usr/local/apache2/conf/
    - /opt/apache/conf/sites-available/:/usr/local/apache2/conf/extra/
    - /opt/apache/certs:/usr/local/apache2/conf/certs
    - /opt/apache/html:/usr/local/apache2/htdocs
    - /opt/apache/logs:/usr/local/apache2/logs

  homarr:
    container_name: homarr
    image: ghcr.io/homarr-labs/homarr:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Optional, only if you want docker integration
      - ./homarr/appdata:/appdata
    env_file:
    - .env
    environment:
      - REDIS_PASSWORD
      - REDIS_URL

  dash:
    image: mauricenino/dashdot:latest
    container_name: dash
    restart: unless-stopped
    privileged: true
    ports:
      - '8081:3001'
    volumes:
      - /:/mnt/host:ro
    environment:
      DASHDOT_ENABLE_CPU_TEMPS: 'true'

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    container_name: openobserve
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ZO_ROOT_USER_EMAIL
      - ZO_ROOT_USER_PASSWORD
    ports:
      - "5080:5080"
    volumes:
      - ./:/data

  alerthandler:
    build: /opt/alerthandler
    container_name: alerthandler
    restart: unless-stopped
    
    depends_on:
      - db
      - cache
    networks:
      - default
    ports:
      - 8010:8010
    env_file:
      - .env
    environment:
      - REDIS_HOST
      - REDIS_PASSWORD
      - REDIS_URL

  fail2ban:
    image: lscr.io/linuxserver/fail2ban:latest
    container_name: fail2ban
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - VERBOSITY=-vv #optional
    volumes:
      - /opt/fail2ban/config:/config
    # Uncomment this after 1st startup to get the default config files  - /opt/fail2ban/config/fail2ban/jail.d:/config/fail2ban/jail.d:ro
    # Uncomment this after 1st startup to get the default config files  - /opt/fail2ban/config/fail2ban/filter.d:/config/fail2ban/filter.d:ro
      - /var/log:/var/log:ro
      - /opt/apache/logs:/remotelogs/apache2:ro
    restart: unless-stopped

volumes:
  db-data: